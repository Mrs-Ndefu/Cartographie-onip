server:
  port: 8080

spring:
  application:
    name: facm01-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carto_onip_rdc}
    username: ${DB_USER:facm01}
    password: ${DB_PASSWORD:facm01}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      # Les photos jointes par l'app Android ne sont pas compressées côté client et peuvent
      # dépasser 8 Mo chacune (appareil photo haute résolution) ; jusqu'à 4 photos par ménage
      # envoyées en un seul POST (cf. HouseholdController.uploadPhotos) — d'où une limite par
      # requête nettement supérieure à la limite par fichier.
      max-file-size: 15MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:changeme-this-must-be-at-least-32-characters-long-for-hs256}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin@onip.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:admin123}
  bootstrap-agent:
    username: ${BOOTSTRAP_AGENT_USERNAME:agent1@onip.local}
    password: ${BOOTSTRAP_AGENT_PASSWORD:agent123}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    address-check:
      # Vérification de la plausibilité des adresses saisies (quartier/rue/immeuble) — cf.
      # AddressAiCheckService. Active par défaut (enabled=true) via une heuristique locale, sans
      # configuration ni coût. Si une clé ANTHROPIC_API_KEY est renseignée, l'IA (Claude) est
      # utilisée à la place, pour un jugement plus fin.
      enabled: ${ADDRESS_AI_CHECK_ENABLED:true}
      anthropic-api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}

logging:
  level:
    com.onip.facm01: INFO
