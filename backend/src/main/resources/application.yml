server:
  port: 8080

spring:
  application:
    name: facm01-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carto_onip_rdc}
    username: ${DB_USER:facm01}
    password: ${DB_PASSWORD:facm01}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

app:
  jwt:
    secret: ${JWT_SECRET:changeme-this-must-be-at-least-32-characters-long-for-hs256}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:admin123}
  bootstrap-agent:
    username: ${BOOTSTRAP_AGENT_USERNAME:agent1}
    password: ${BOOTSTRAP_AGENT_PASSWORD:agent123}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.onip.facm01: INFO
