# Profil de test sans Docker/PostgreSQL : base H2 embarquée, stockée dans backend/data/.
# Activation : ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring:
  datasource:
    # Pas de MODE=PostgreSQL : ce mode de compatibilité ne reconnaît pas le type BLOB
    # (utilisé pour la photo de profil des agents), Hibernate s'en charge déjà via H2Dialect.
    url: jdbc:h2:file:./data/carto_onip_rdc;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
