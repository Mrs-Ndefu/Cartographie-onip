<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zones — Adressage de Ménages</title>
  <link rel="icon" type="image/png" th:href="@{/img/onip-logo.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
  <header class="topbar">
    <img th:src="@{/img/onip-logo.png}" alt="ONIP" class="topbar-logo">
    <h1>Adressage de Ménages — Zones d'affectation</h1>
    <nav class="topbar-nav">
      <a th:href="@{/dashboard}" class="link-btn">← Tableau de bord</a>
      <a th:if="${currentAgent != null and currentAgent.role.canAccessAgents()}"
         th:href="@{/dashboard/agents}" class="link-btn">Gérer les agents</a>
      <a th:href="@{/dashboard/profile}" class="avatar-link" title="Mon profil">
        <img th:if="${currentAgent != null and currentAgent.photoDataUrl != null}"
             th:src="${currentAgent.photoDataUrl}" alt="" class="avatar-img-lg">
        <span th:unless="${currentAgent != null and currentAgent.photoDataUrl != null}" class="avatar-placeholder-lg"
              th:text="${currentAgent != null ? #strings.substring(currentAgent.fullName,0,1) : '?'}">?</span>
      </a>
    </nav>
  </header>

  <div class="container-fluid px-4">
    <div class="mt-3 agents-messages">
      <div th:if="${success}" class="alert alert-success py-2" th:text="${success}">-</div>
      <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}">-</div>
    </div>

    <div class="card my-3" th:if="${currentAgent != null and currentAgent.role.canManageZones()}">
      <div class="card-body">
        <h2 class="h6 text-uppercase text-secondary mb-3">Définir une zone</h2>
        <form th:action="@{/dashboard/zones}" method="post" class="row g-3 align-items-end">
          <div class="col-sm-6 col-md-3">
            <label class="form-label small fw-semibold">Province *</label>
            <select name="province" class="form-select" required>
              <option value="">—</option>
              <option th:each="pr : ${provinces}" th:value="${pr}" th:text="${pr}">Province</option>
            </select>
          </div>
          <div class="col-sm-6 col-md-3">
            <label class="form-label small fw-semibold">Ville *</label>
            <input type="text" name="ville" class="form-control" required>
          </div>
          <div class="col-sm-6 col-md-2">
            <label class="form-label small fw-semibold">Commune *</label>
            <input type="text" name="commune" class="form-control" required>
          </div>
          <div class="col-sm-6 col-md-3">
            <label class="form-label small fw-semibold">Quartier</label>
            <input type="text" name="quartier" class="form-control" placeholder="Vide = toute la commune">
          </div>
          <div class="col-sm-6 col-md-1">
            <button type="submit" class="btn btn-primary w-100">Créer</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card mb-4">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Province</th>
              <th>Ville</th>
              <th>Commune</th>
              <th>Quartier</th>
              <th>Agents affectés</th>
              <th th:if="${currentAgent != null and currentAgent.role.canManageZones()}">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="z : ${zones}">
              <td th:text="${z.province}">-</td>
              <td th:text="${z.ville}">-</td>
              <td th:text="${z.commune}">-</td>
              <td th:text="${z.quartier ?: 'Toute la commune'}">-</td>
              <td th:text="${agentCounts[z.id]}">0</td>
              <td th:if="${currentAgent != null and currentAgent.role.canManageZones()}">
                <form th:action="@{/dashboard/zones/{id}/delete(id=${z.id})}" method="post"
                      class="js-confirm-form"
                      data-confirm-title="Voulez-vous supprimer cette zone ?"
                      data-confirm-label="Supprimer"
                      th:data-confirm-detail="${z.label} + ' — les agents affectés à cette zone n\'auront plus de zone.'">
                  <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                </form>
              </td>
            </tr>
            <tr th:if="${zones.isEmpty()}">
              <td colspan="6" class="text-center text-secondary py-3">Aucune zone définie pour l'instant.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="confirm-modal" class="confirm-overlay" hidden>
    <div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <h3 id="confirm-title" class="confirm-title">Voulez-vous supprimer cette zone ?</h3>
      <p class="confirm-message"></p>
      <div class="confirm-actions">
        <button type="button" class="btn btn-sm btn-outline-secondary confirm-cancel">Annuler</button>
        <button type="button" class="btn btn-sm btn-danger confirm-ok">Supprimer</button>
      </div>
    </div>
  </div>

  <script th:src="@{/js/app.js}"></script>
</body>
</html>
