<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statistiques — Adressage de Ménages</title>
  <link rel="icon" type="image/png" th:href="@{/img/onip-logo.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
  <!-- Page de la Direction Générale : uniquement les statistiques d'enregistrement des ménages et
       la population totale — ni liste de ménages, ni carte, ni gestion des comptes. -->
  <header class="topbar">
    <img th:src="@{/img/onip-logo.png}" alt="ONIP" class="topbar-logo">
    <h1>ADRESSAGE DE MÉNAGES — STATISTIQUES</h1>
    <nav class="topbar-nav">
      <a th:if="${currentAgent != null and currentAgent.role.canViewHouseholds()}"
         th:href="@{/dashboard}" class="link-btn">← Tableau de bord</a>
      <div class="agent-summary" th:if="${currentAgent != null}">
        <span class="agent-role-badge" th:text="${currentAgent.role}">ROLE</span>
      </div>
      <a th:href="@{/dashboard/profile}" class="avatar-link" title="Mon profil">
        <img th:if="${currentAgent != null and currentAgent.photoDataUrl != null}"
             th:src="${currentAgent.photoDataUrl}" alt="" class="avatar-img-lg">
        <span th:unless="${currentAgent != null and currentAgent.photoDataUrl != null}" class="avatar-placeholder-lg"
              th:text="${currentAgent != null ? #strings.substring(currentAgent.fullName,0,1) : '?'}">?</span>
      </a>
    </nav>
  </header>

  <section class="hero-row">
    <div class="population-hero">
      <span class="population-hero-value" th:text="${total}" th:data-target="${total}">0</span>
      <span class="population-hero-label">Total ménages</span>
    </div>
    <div class="population-hero">
      <span class="population-hero-value" th:text="${population}" th:data-target="${population}">0</span>
      <span class="population-hero-label">Population totale</span>
    </div>
  </section>

  <section class="overview-row">
    <div class="stat-grid">
      <div class="stat-card">
        <span class="stat-value" th:text="${registrationCounts.today}">0</span>
        <span class="stat-label">Aujourd'hui</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" th:text="${registrationCounts.thisMonth}">0</span>
        <span class="stat-label">Ce mois-ci</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" th:text="${registrationCounts.thisYear}">0</span>
        <span class="stat-label">Cette année</span>
      </div>
    </div>
    <div class="chart-card">
      <h2>Enregistrements mensuels (12 derniers mois)</h2>
      <canvas id="monthly-chart"></canvas>
    </div>
  </section>

  <script src="https://unpkg.com/chart.js@4/dist/chart.umd.js"></script>
  <script th:inline="javascript">
    /*<![CDATA[*/
    (function () {
      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      document.querySelectorAll('.population-hero-value').forEach(function (el) {
        var card = el.closest('.population-hero');
        var target = parseInt(el.getAttribute('data-target'), 10) || 0;
        var duration = 1200;
        var start = null;

        el.classList.add('is-counting');
        if (card) card.classList.add('is-counting');

        function step(timestamp) {
          if (start === null) start = timestamp;
          var progress = Math.min((timestamp - start) / duration, 1);
          el.textContent = Math.round(easeOutCubic(progress) * target).toLocaleString('fr-FR');
          if (progress < 1) {
            requestAnimationFrame(step);
          }
        }

        requestAnimationFrame(step);
      });
    })();

    const monthlyRegistrations = /*[[${monthlyRegistrations}]]*/ [];

    new Chart(document.getElementById('monthly-chart'), {
      type: 'bar',
      data: {
        labels: monthlyRegistrations.map(function (m) { return m.label; }),
        datasets: [{
          label: 'Ménages enregistrés',
          data: monthlyRegistrations.map(function (m) { return m.count; }),
          backgroundColor: '#178a17'
        }]
      },
      options: {
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
      }
    });
    /*]]>*/
  </script>
</body>
</html>
