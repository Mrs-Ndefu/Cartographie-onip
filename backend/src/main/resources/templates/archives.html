<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <meta name="_csrf_parameter" th:content="${_csrf.parameterName}">
  <title>Ménages retirés — Adressage de Ménages</title>
  <link rel="icon" type="image/png" th:href="@{/img/onip-logo.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
  <header class="topbar">
    <img th:src="@{/img/onip-logo.png}" alt="ONIP" class="topbar-logo">
    <h1>Adressage de Ménages — Ménages retirés</h1>
    <nav class="topbar-nav">
      <a th:href="@{/dashboard}" class="link-btn">← Tableau de bord</a>
      <a th:href="@{/dashboard/profile}" class="avatar-link" title="Mon profil">
        <img th:if="${currentAgent != null and currentAgent.photoDataUrl != null}"
             th:src="${currentAgent.photoDataUrl}" alt="" class="avatar-img-lg">
        <span th:unless="${currentAgent != null and currentAgent.photoDataUrl != null}" class="avatar-placeholder-lg"
              th:text="${currentAgent != null ? #strings.substring(currentAgent.fullName,0,1) : '?'}">?</span>
      </a>
    </nav>
  </header>

  <section class="agents-messages">
    <div th:if="${success}" class="alert alert-success py-2" th:text="${success}">-</div>
    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}">-</div>
  </section>

  <section class="table-section">
    <div class="table-card">
      <div class="table-card-header">
        <div>
          <h2>Ménages retirés</h2>
          <span class="table-card-count" th:text="${page.totalElements} + ' au total'">0 au total</span>
        </div>
        <form th:action="@{/dashboard/archives}" method="get" class="table-search-form" role="search">
          <svg class="table-search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M14 14L18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input type="search" name="search" class="table-search-input"
                 placeholder="Chef de ménage ou code ménage…" th:value="${search}">
          <button type="submit" class="visually-hidden">Rechercher</button>
        </form>
      </div>
      <div class="table-scroll">
        <table class="households-table">
          <thead>
            <tr>
              <th>Code Ménage</th>
              <th>Chef</th>
              <th>Ville</th>
              <th>Commune</th>
              <th>Retiré le</th>
              <th class="col-actions">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="h : ${households}">
              <td class="cell-code" th:text="${h.codeMenage}">-</td>
              <td th:text="${h.chef != null ? #strings.trim(#strings.defaultString(h.chef.prenom,'') + ' ' + #strings.defaultString(h.chef.nom,'')) : '-'}">-</td>
              <td th:text="${h.address != null ? h.address.ville : '-'}">-</td>
              <td th:text="${h.address != null ? h.address.commune : '-'}">-</td>
              <td class="cell-date" th:text="${h.archivedAt != null ? #temporals.format(h.archivedAt, 'dd/MM/yyyy HH:mm') : '-'}">-</td>
              <td class="col-actions">
                <div class="d-flex gap-1">
                  <a th:href="@{/dashboard/households/{id}(id=${h.id})}" class="btn btn-sm btn-outline-secondary btn-icon"
                     title="Détail" aria-label="Détail">
                    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                      <path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6S1.5 10 1.5 10Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                      <circle cx="10" cy="10" r="2.3" stroke="currentColor" stroke-width="1.4"/>
                    </svg>
                  </a>
                  <form th:if="${currentAgent != null and currentAgent.role.canRestoreHouseholds()}"
                        th:action="@{/dashboard/households/{id}/restore(id=${h.id})}" method="post"
                        class="js-confirm-form"
                        data-confirm-title="Voulez-vous restaurer ce ménage ?"
                        data-confirm-label="Restaurer"
                        data-confirm-variant="success"
                        th:data-confirm-detail="${h.codeMenage} + ' — il redeviendra visible dans la liste principale du tableau de bord.'">
                    <button type="submit" class="btn btn-sm btn-outline-success btn-icon" title="Restaurer" aria-label="Restaurer">
                      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                        <path d="M4 9a6 6 0 1 1 1.5 4.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                        <path d="M4 5.5V9h3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
            <tr th:if="${households.isEmpty()}">
              <td colspan="6" class="table-empty">Aucun ménage retiré pour l'instant.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <nav th:if="${page.totalPages > 1}" aria-label="Pagination des ménages retirés" class="table-card-footer">
        <ul class="pagination pagination-sm mb-1">
          <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
            <a class="page-link" th:href="@{/dashboard/archives(page=${page.number - 1}, search=${search})}">Précédent</a>
          </li>
          <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:classappend="${i == page.number} ? 'active'">
            <a class="page-link" th:href="@{/dashboard/archives(page=${i}, search=${search})}" th:text="${i + 1}">1</a>
          </li>
          <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
            <a class="page-link" th:href="@{/dashboard/archives(page=${page.number + 1}, search=${search})}">Suivant</a>
          </li>
        </ul>
        <p class="text-secondary small mb-0">
          Page <span th:text="${page.number + 1}">1</span> / <span th:text="${page.totalPages}">1</span>
          — <span th:text="${page.totalElements}">0</span> ménage(s) au total
        </p>
      </nav>
    </div>
  </section>

  <div id="confirm-modal" class="confirm-overlay" hidden>
    <div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <h3 id="confirm-title" class="confirm-title">Voulez-vous retirer ce ménage ?</h3>
      <p class="confirm-message"></p>
      <div class="confirm-actions">
        <button type="button" class="btn btn-sm btn-outline-secondary confirm-cancel">Annuler</button>
        <button type="button" class="btn btn-sm btn-danger confirm-ok">Retirer</button>
      </div>
    </div>
  </div>

  <script th:src="@{/js/app.js}"></script>
</body>
</html>
