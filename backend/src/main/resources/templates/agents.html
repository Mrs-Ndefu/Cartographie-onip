<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agents — Carto-Onip-RDC</title>
  <link rel="icon" type="image/png" th:href="@{/img/onip-logo.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
  <header class="topbar">
    <img th:src="@{/img/onip-logo.png}" alt="ONIP" class="topbar-logo">
    <h1>Carto-Onip-RDC — Gestion des agents</h1>
    <nav class="topbar-nav">
      <a th:href="@{/dashboard}" class="link-btn">← Tableau de bord</a>
      <a th:href="@{/dashboard/profile}" class="avatar-link" title="Mon profil">
        <img th:if="${currentAgent != null and currentAgent.photoDataUrl != null}"
             th:src="${currentAgent.photoDataUrl}" alt="" class="avatar-img-lg">
        <span th:unless="${currentAgent != null and currentAgent.photoDataUrl != null}" class="avatar-placeholder-lg"
              th:text="${currentAgent != null ? #strings.substring(currentAgent.fullName,0,1) : '?'}">?</span>
      </a>
    </nav>
  </header>

  <div class="container-fluid px-4">
    <div class="mt-3">
      <div th:if="${success}" class="alert alert-success py-2" th:text="${success}">-</div>
      <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}">-</div>
    </div>

    <div class="card my-3">
      <div class="card-body">
        <h2 class="h6 text-uppercase text-secondary mb-3">Créer un agent</h2>
        <form th:action="@{/dashboard/agents}" method="post" class="row g-3 align-items-end">
          <div class="col-sm-6 col-md-3">
            <label class="form-label small fw-semibold">Nom d'utilisateur</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="col-sm-6 col-md-3">
            <label class="form-label small fw-semibold">Mot de passe</label>
            <div class="input-group">
              <input type="password" name="password" class="form-control" required minlength="6">
              <button type="button" class="btn btn-outline-secondary toggle-password" aria-label="Afficher le mot de passe">👁</button>
            </div>
          </div>
          <div class="col-sm-6 col-md-3">
            <label class="form-label small fw-semibold">Nom complet</label>
            <input type="text" name="fullName" class="form-control" required>
          </div>
          <div class="col-sm-6 col-md-2">
            <label class="form-label small fw-semibold">Rôle</label>
            <select name="role" class="form-select">
              <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">ROLE</option>
            </select>
          </div>
          <div class="col-sm-6 col-md-1">
            <button type="submit" class="btn btn-primary w-100">Créer</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card mb-4">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Utilisateur</th>
              <th>Nom complet</th>
              <th>Rôle</th>
              <th>Statut</th>
              <th>Créé le</th>
              <th style="min-width: 280px;">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="a : ${agents}">
              <td class="fw-semibold" th:text="${a.username}">-</td>
              <td th:text="${a.fullName}">-</td>
              <td><span class="badge text-bg-secondary" th:text="${a.role}">-</span></td>
              <td>
                <span th:text="${a.active} ? 'Actif' : 'Désactivé'"
                      th:class="${a.active} ? 'badge text-bg-success' : 'badge text-bg-danger'">-</span>
              </td>
              <td th:text="${a.createdAt}">-</td>
              <td>
                <div class="d-flex flex-column gap-2">
                  <form th:action="@{/dashboard/agents/{id}/active(id=${a.id})}" method="post">
                    <input type="hidden" name="active" th:value="${!a.active}">
                    <button type="submit" class="btn btn-sm w-100"
                            th:classappend="${a.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                            th:text="${a.active} ? 'Désactiver' : 'Réactiver'">-</button>
                  </form>

                  <form th:action="@{/dashboard/agents/{id}/role(id=${a.id})}" method="post" class="d-flex gap-1">
                    <select name="role" class="form-select form-select-sm">
                      <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == a.role}">ROLE</option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-outline-primary">OK</button>
                  </form>

                  <form th:action="@{/dashboard/agents/{id}/reset-password(id=${a.id})}" method="post" class="input-group input-group-sm">
                    <input type="password" name="newPassword" class="form-control" placeholder="Nouveau mot de passe" minlength="6" required>
                    <button type="button" class="btn btn-outline-secondary toggle-password" aria-label="Afficher le mot de passe">👁</button>
                    <button type="submit" class="btn btn-outline-secondary">OK</button>
                  </form>
                </div>
              </td>
            </tr>
            <tr th:if="${agents.isEmpty()}">
              <td colspan="6" class="text-center text-secondary py-3">Aucun agent.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script th:src="@{/js/app.js}"></script>
</body>
</html>
