<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon profil — Adressage de Ménages</title>
  <link rel="icon" type="image/png" th:href="@{/img/onip-logo.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
  <header class="topbar">
    <img th:src="@{/img/onip-logo.png}" alt="ONIP" class="topbar-logo">
    <h1>Adressage de Ménages — Mon profil</h1>
    <nav class="topbar-nav">
      <a th:if="${agent.role.isAdminTier()}" th:href="@{/dashboard}" class="link-btn">← Tableau de bord</a>
      <a th:if="${agent.role.name() == 'SUPERVISEUR'}" th:href="@{/dashboard/agents}" class="link-btn">← Gestion des agents</a>
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-btn">Se déconnecter</button>
      </form>
    </nav>
  </header>

  <div class="container-fluid px-4" style="max-width: 520px;">
    <div class="mt-3">
      <div th:if="${success}" class="alert alert-success py-2" th:text="${success}">-</div>
      <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}">-</div>
    </div>

    <div class="card my-3">
      <div class="card-body text-center">
        <img th:if="${agent.photoDataUrl}" th:src="${agent.photoDataUrl}" alt="Photo de profil"
             class="rounded-circle mb-2" style="width:96px;height:96px;object-fit:cover;">
        <div th:unless="${agent.photoDataUrl}" class="rounded-circle mb-2 mx-auto d-flex align-items-center justify-content-center"
             style="width:96px;height:96px;background:#1177c8;color:white;font-size:2rem;font-weight:700;">
          <span th:text="${#strings.substring(agent.fullName,0,1)}">A</span>
        </div>
        <p class="fw-semibold mb-0" th:text="${agent.fullName}">-</p>
        <p class="text-secondary small mb-3" th:text="'@' + ${agent.username}">-</p>

        <form th:action="@{/dashboard/profile/photo}" method="post" enctype="multipart/form-data" class="d-flex gap-2 justify-content-center">
          <input type="file" name="file" accept="image/*" class="form-control form-control-sm" style="max-width: 220px;" required>
          <button type="submit" class="btn btn-sm btn-outline-primary">Envoyer</button>
        </form>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="h6 text-uppercase text-secondary mb-3">Changer le mot de passe</h2>
        <form th:action="@{/dashboard/profile/password}" method="post" class="d-flex flex-column gap-2">
          <label class="form-label small fw-semibold mb-0">Mot de passe actuel</label>
          <div class="input-group input-group-sm">
            <input type="password" name="currentPassword" class="form-control" required>
            <button type="button" class="btn btn-outline-secondary toggle-password">👁</button>
          </div>

          <label class="form-label small fw-semibold mb-0">Nouveau mot de passe</label>
          <div class="input-group input-group-sm">
            <input type="password" name="newPassword" class="form-control" minlength="6" required>
            <button type="button" class="btn btn-outline-secondary toggle-password">👁</button>
          </div>

          <label class="form-label small fw-semibold mb-0">Confirmer le nouveau mot de passe</label>
          <div class="input-group input-group-sm">
            <input type="password" name="confirmPassword" class="form-control" minlength="6" required>
            <button type="button" class="btn btn-outline-secondary toggle-password">👁</button>
          </div>

          <button type="submit" class="btn btn-primary mt-2">Mettre à jour le mot de passe</button>
        </form>
      </div>
    </div>
  </div>

  <script th:src="@{/js/app.js}"></script>
</body>
</html>
