<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Cloche de notification (ADMIN/SUPERVISEUR/SUPER_ADMIN), partagée entre le tableau de bord et
     les pages du repérage : un point rouge avec le nombre total d'éléments à traiter — foyers
     incomplets (countIncomplet) et fiches de repérage incomplètes en attente d'une action
     (countSitesIncomplets, cf. Site.champsManquants). Au clic, un menu détaille chaque compteur
     avec un lien "Consulter" (cf. app.js, #pending-notif-bell). -->
<div th:fragment="bell" class="notif-wrap"
     th:if="${currentAgent != null and (currentAgent.role.name() == 'ADMIN' or currentAgent.role.name() == 'SUPERVISEUR' or currentAgent.role.name() == 'SUPER_ADMIN')}"
     th:with="nbFoyers=${countIncomplet ?: 0}, nbSites=${countSitesIncomplets ?: 0}">
  <button type="button" id="pending-notif-bell" class="notif-bell"
          title="Éléments incomplets en attente de traitement" th:attr="data-pending-count=${nbFoyers + nbSites}"
          aria-haspopup="true" aria-expanded="false">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M10 2.3c-2.5 0-4.4 2-4.4 4.6v2.2c0 1-.3 1.9-.9 2.7l-.6.8c-.5.7 0 1.6.8 1.6h10.2c.8 0 1.3-.9.8-1.6l-.6-.8c-.6-.8-.9-1.7-.9-2.7V6.9c0-2.6-1.9-4.6-4.4-4.6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M8.3 16.6a1.9 1.9 0 0 0 3.4 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <span class="notif-badge" id="pending-notif-badge" hidden>0</span>
  </button>
  <div id="pending-notif-popover" class="notif-popover" hidden>
    <div class="notif-item">
      <p class="notif-popover-text"
         th:text="${nbFoyers} + ' foyer(s) incomplet(s) en attente de validation.'">-</p>
      <a th:href="@{/dashboard#menages(statut='incomplet')}" class="btn btn-sm btn-primary w-100"
         th:classappend="${nbFoyers == 0} ? 'disabled'">Consulter les foyers</a>
    </div>
    <div class="notif-item">
      <p class="notif-popover-text"
         th:text="${nbSites} + ' fiche(s) de repérage incomplète(s) à traiter.'">-</p>
      <a th:href="@{/dashboard/sites(incompletes=true)}" class="btn btn-sm btn-primary w-100"
         th:classappend="${nbSites == 0} ? 'disabled'">Consulter le repérage</a>
    </div>
  </div>
</div>
</body>
</html>
